<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>創作ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F0F0EE;
    --ink:#262626;
    --ink-soft:#6E6E6E;
    --ink-faint:#A0A09E;
    --line:#EBEBE9;
    --line-strong:#CFCFCB;
    --accent:#262626;
    --accent-deep:#171717;
    --accent-ink:#FBFBFA;
    --teal:#0FA394;
    --yellow:#E0A63C;
    --purple:#7C5CFC;
    --red:#E24E6B;
    --green:#1FA070;
    --gray:#9C9A96;
    --neu-light: rgba(255,255,255,.9);
    --neu-dark: rgba(150,150,148,.16);
    --shadow: 7px 7px 14px var(--neu-dark), -7px -7px 14px var(--neu-light);
    --shadow-sm: 4px 4px 9px var(--neu-dark), -4px -4px 9px var(--neu-light);
    --shadow-inset: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
    --shadow-inset-sm: inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light);
    --ring: 0 0 0 1.5px rgba(38,38,38,.18);
    --ring-hover: 0 0 0 1.5px rgba(38,38,38,.36);
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 6px;
    --font-display:'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    --font-body:'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html{ scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent; }
  html::-webkit-scrollbar{ width:10px; }
  html::-webkit-scrollbar-track{ background:transparent; margin-block:10px; }
  html::-webkit-scrollbar-thumb{ background-color:var(--line-strong); border-radius:999px; border:2.5px solid var(--bg); background-clip:padding-box; }
  html::-webkit-scrollbar-thumb:hover{ background-color:var(--ink-faint); }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.7;
  }
  h1,h2,h3,h4{ font-family:var(--font-display); margin:0; text-wrap:balance; color:var(--ink); }
  button,input,select,textarea{ font-family:var(--font-body); }
  p{ margin:0; }
  a{ color:var(--accent-deep); }
  ::selection{ background:var(--line-strong); color:var(--ink); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }

  @keyframes popIn{ from{ opacity:0; transform:scale(.9);} to{ opacity:1; transform:scale(1);} }

  button{ cursor:pointer; border:none; font-weight:700; }
  .btn{
    display:inline-flex; align-items:center; gap:6px; justify-content:center;
    background:var(--bg); color:var(--ink); border:none;
    padding:9px 18px; border-radius:999px; font-size:14px; box-shadow:var(--shadow-sm), var(--ring);
    transition:box-shadow .15s ease, transform .1s ease;
  }
  .btn:hover{ box-shadow:var(--shadow), var(--ring-hover); }
  .btn:active{ box-shadow:var(--shadow-inset-sm), var(--ring-hover); transform:scale(.96); }
  .btn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); box-shadow:5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light); }
  .btn-primary:hover{ box-shadow:7px 7px 14px var(--neu-dark), -7px -7px 14px var(--neu-light); }
  .btn-primary:active{ box-shadow:inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light); }
  .btn-ghost{ background:transparent; box-shadow:var(--ring); color:var(--ink-soft); }
  .btn-ghost:hover{ color:var(--ink); background:var(--surface-2); box-shadow:var(--shadow-inset-sm), var(--ring-hover); }
  .btn-danger{ background:#FFF0EE; color:var(--red); box-shadow:2px 2px 5px var(--neu-dark), -2px -2px 5px var(--neu-light), 0 0 0 1.5px rgba(226,78,106,.25); }
  .btn-danger:hover{ box-shadow:3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light), 0 0 0 1.5px rgba(226,78,106,.4); }
  .btn-danger:active{ box-shadow:inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light), 0 0 0 1.5px rgba(226,78,106,.4); }
  .btn-sm{ padding:6px 12px; font-size:12.5px; box-shadow:2.5px 2.5px 6px var(--neu-dark), -2.5px -2.5px 6px var(--neu-light), var(--ring); }
  .btn-sm:hover{ box-shadow:3.5px 3.5px 8px var(--neu-dark), -3.5px -3.5px 8px var(--neu-light), var(--ring-hover); }
  .btn-sm:active{ box-shadow:inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light), var(--ring-hover); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }

  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%; border:none; border-radius:var(--radius-sm);
    padding:10px 12px; font-size:14px; font-weight:500; font-family:var(--font-body); background:var(--surface-2); color:var(--ink);
    box-shadow:none;
  }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input::placeholder,textarea::placeholder{ color:var(--ink-faint); font-weight:400; opacity:1; }
  input:focus,textarea:focus,select:focus{ outline:none; box-shadow:0 0 0 3px rgba(38,38,38,.24); }
  textarea{ resize:vertical; min-height:70px; }
  label.field{ display:block; margin-bottom:12px; }
  label.field > span{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.02em; }
  .hint{ font-size:12px; color:var(--ink-faint); margin-top:4px; }
  .hint-warn{ color:#B8790C; font-weight:700; }

  input[type=color]{ -webkit-appearance:none; width:38px; height:38px; border:none; border-radius:10px; padding:2px; background:var(--surface-2); box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--ink); flex:none; }
  input[type=color]::-webkit-color-swatch{ border-radius:6px; border:none; }
  .color-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .swatches{ display:flex; gap:6px; flex-wrap:wrap; }
  .swatch{ width:24px; height:24px; border-radius:50%; border:2px solid rgba(0,0,0,.08); cursor:pointer; transition:transform .1s; }
  .swatch:hover{ transform:scale(1.15); }
  .swatch.active{ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  input.hexcode-input{ width:84px; font-family:monospace; font-size:12px; color:var(--ink-soft); background:var(--surface-2); padding:6px 8px; border-radius:8px; box-shadow:none; text-transform:uppercase; }
  input.hexcode-input:focus{ color:var(--ink); box-shadow:0 0 0 3px rgba(38,38,38,.24); }
  .palette-bar{ display:flex; width:100%; max-width:360px; height:16px; border-radius:8px; overflow:hidden; box-shadow:var(--shadow-inset-sm); margin-bottom:14px; }
  .palette-bar-seg{ height:100%; transition:width .15s ease; }
  .palette-roles{ display:flex; flex-direction:column; gap:14px; }
  .palette-role-block{ display:flex; flex-direction:column; gap:6px; }
  .palette-role-top{ display:flex; align-items:center; gap:10px; }
  .palette-role-label{ font-size:12px; font-weight:700; color:var(--ink-soft); width:64px; flex:none; }
  .palette-swatch{ width:32px; height:32px; border-radius:10px; flex:none; box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--ink); position:relative; overflow:hidden; }
  .palette-role-slider-row{ display:flex; align-items:center; gap:8px; padding-left:74px; }
  input.palette-pct-slider{ flex:none; width:160px; max-width:50%; }
  .palette-pct-readout{
    font-size:12px; font-family:monospace; color:var(--ink-soft); background:var(--surface-2);
    width:42px; max-width:42px; text-align:right; flex:none; padding:4px 6px; border-radius:8px; box-shadow:none;
  }
  .palette-pct-suffix{ font-size:12px; color:var(--ink-faint); flex:none; }
  .palette-total{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .palette-total.warn{ color:#B98900; }
  .image-field-row{ display:flex; align-items:center; gap:12px; }
  .image-preview{ width:72px; height:72px; border-radius:16px; overflow:hidden; background:var(--surface-2); box-shadow:var(--shadow-inset-sm); flex:none; display:flex; align-items:center; justify-content:center; }
  .image-preview img{ width:100%; height:100%; object-fit:cover; display:block; }
  .image-preview-empty{ font-size:10.5px; color:var(--ink-faint); text-align:center; padding:0 6px; }
  .crop-viewport{ position:relative; overflow:hidden; border-radius:50%; box-shadow:var(--shadow-inset), 0 0 0 3px var(--bg), 0 0 0 5px var(--line-strong); cursor:grab; touch-action:none; background:var(--surface-2); }
  .crop-viewport:active{ cursor:grabbing; }
  .crop-img{ position:absolute; left:0; top:0; user-select:none; pointer-events:none; }
  .zoom-range{ -webkit-appearance:none; appearance:none; flex:1; height:14px; background:transparent; cursor:pointer; }
  .zoom-range::-webkit-slider-runnable-track{ height:4px; border-radius:999px; background:var(--line-strong); }
  .zoom-range::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:13px; height:13px; border-radius:999px; background-color:var(--line-strong); border:2.5px solid var(--bg); background-clip:padding-box; margin-top:-4.5px; transition:background-color .15s; }
  .zoom-range:hover::-webkit-slider-thumb{ background-color:var(--ink-faint); }
  .zoom-range::-moz-range-track{ height:4px; border-radius:999px; background:var(--line-strong); }
  .zoom-range::-moz-range-thumb{ width:13px; height:13px; border-radius:999px; background-color:var(--line-strong); border:2.5px solid var(--bg); background-clip:padding-box; transition:background-color .15s; }
  .zoom-range:hover::-moz-range-thumb{ background-color:var(--ink-faint); }
  .image-field-controls{ display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .image-field-controls input[type=file]{ font-size:12px; padding:0; border:none; }
  .image-field-controls .btn{ padding:4px 10px; font-size:11px; }
  .image-list-grid{ display:flex; flex-wrap:wrap; gap:10px; }
  .image-list-item{ position:relative; width:72px; height:72px; border-radius:16px; overflow:hidden; background:var(--surface-2); box-shadow:var(--shadow-inset-sm); flex:none; }
  .image-list-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .image-list-remove{
    position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; border:none;
    background:rgba(20,16,24,.65); color:#fff; font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .image-list-add{
    width:72px; height:72px; border-radius:16px; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; color:var(--ink-faint); background:var(--surface-2); box-shadow:var(--shadow-inset-sm); cursor:pointer;
  }
  .image-list-add:hover{ color:var(--accent-deep); box-shadow:var(--shadow-inset-sm), var(--ring-hover); }
  .image-size-caption{ font-size:10.5px; color:var(--ink-faint); font-family:monospace; }
  .image-list-size{
    position:absolute; left:0; right:0; bottom:0; padding:2px 4px; text-align:center;
    font-size:9px; font-family:monospace; color:#fff; background:rgba(20,16,24,.6);
  }
  .image-total-meter{
    font-size:11.5px; color:var(--ink-soft); background:var(--surface-2); border-radius:var(--radius-sm);
    padding:8px 12px; margin-top:4px;
  }
  .image-total-meter.over{ color:#B3261E; background:#FBEAE9; font-weight:700; }

  /* App shell */
  #app{ min-height:100vh; display:flex; }
  .hidden{ display:none !important; }

  /* Gate: project picker */
  #gate{ width:100%; max-width:900px; margin:0 auto; padding:48px 20px 60px; }
  .usage-box{ display:flex; align-items:center; gap:10px; margin-top:28px; flex-wrap:wrap; }
  .usage-result{ font-size:12.5px; color:var(--ink-soft); }
  #authGate{ width:100%; max-width:460px; margin:0 auto; padding:90px 20px 40px; text-align:center; }
  .auth-box{ margin-top:28px; background:var(--bg); border-radius:var(--radius-lg); padding:28px; box-shadow:var(--shadow); }
  .auth-status{ color:var(--ink-soft); font-size:14px; margin-bottom:16px; }
  .auth-denied p{ color:var(--ink-soft); font-size:13.5px; line-height:1.7; margin-bottom:16px; }
  .auth-denied b{ color:var(--ink); }
  .gate-hero{ text-align:center; margin-bottom:36px; }
  .gate-hero h1{ font-size:clamp(26px,5vw,34px); font-weight:800; margin-top:8px; }
  .gate-hero p{ color:var(--ink-soft); margin-top:8px; font-size:14.5px; }
  .project-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; margin-top:24px; }
  .project-card{
    background:var(--bg); border:none; border-radius:var(--radius-lg);
    padding:20px; box-shadow:var(--shadow), var(--ring); cursor:pointer; text-align:left; position:relative; overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .project-card:hover{ transform:translateY(-3px); box-shadow:9px 9px 18px var(--neu-dark), -9px -9px 18px var(--neu-light), var(--ring-hover); }
  .project-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:8px; background:var(--pc,var(--accent)); }
  .project-card .pname{ font-weight:800; font-size:17px; margin-top:6px; }
  .project-card .pdesc{ color:var(--ink-soft); font-size:12.5px; margin-top:6px; min-height:34px; }
  .project-card .pmeta{ display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .pmeta-btn{ font-family:var(--font-body); font-size:11.5px; font-weight:700; color:var(--ink-soft); background:var(--bg); border:none; border-radius:999px; padding:4px 12px; box-shadow:2.5px 2.5px 6px var(--neu-dark), -2.5px -2.5px 6px var(--neu-light), var(--ring); }
  .pmeta-btn:hover{ color:var(--ink); box-shadow:3.5px 3.5px 8px var(--neu-dark), -3.5px -3.5px 8px var(--neu-light), var(--ring-hover); }
  .pmeta-btn:active{ box-shadow:inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light), var(--ring-hover); }
  .project-new{
    border:none; border-radius:var(--radius-lg); background:var(--bg); box-shadow:var(--shadow), var(--ring);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:130px;
    color:var(--ink-soft); font-size:14px; font-weight:700; cursor:pointer; transition:box-shadow .15s ease;
  }
  .project-new:hover{ color:var(--accent-deep); box-shadow:9px 9px 18px var(--neu-dark), -9px -9px 18px var(--neu-light), var(--ring-hover); }
  .project-new:active{ box-shadow:var(--shadow-inset), var(--ring-hover); }
  .project-new .plus{ font-size:26px; }

  /* Sidebar */
  .sidebar{
    width:230px; flex:none; background:var(--bg); border-right:none;
    display:flex; flex-direction:column; padding:18px 14px; gap:18px; position:sticky; top:0; height:100vh; overflow-y:auto;
    box-shadow:6px 0 16px var(--neu-dark);
  }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px; padding:0 4px; }
  .current-project{
    background:var(--bg); border-radius:var(--radius-md); padding:12px; box-shadow:var(--shadow-inset-sm);
  }
  .current-project .cp-top{ display:flex; align-items:center; gap:8px; }
  .cp-dot{ width:14px; height:14px; border-radius:50%; flex:none; background:var(--pc,var(--accent)); box-shadow:0 0 0 3px rgba(0,0,0,.05); }
  .current-project .cp-name{ font-weight:800; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cp-switch{ margin-top:8px; width:100%; }

  nav.tabs{ display:flex; flex-direction:column; gap:4px; }
  .tab-btn{
    display:flex; align-items:center; gap:10px; text-align:left; background:transparent; border:none;
    padding:10px 12px; border-radius:var(--radius-sm); color:var(--ink-soft); font-weight:700; font-size:14px;
    position:relative; transition:box-shadow .15s ease, color .15s ease;
  }
  .tab-btn:hover{ color:var(--ink); box-shadow:var(--shadow-sm); }
  .tab-btn.active{ background:var(--bg); color:var(--accent-deep); box-shadow:var(--shadow); font-weight:800; }
  .tab-badge{ margin-left:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:800; border-radius:999px; padding:1px 7px; }

  .sidebar-foot{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
  .nickname-box label.field{ margin-bottom:0; }
  .sync-pill{ font-size:11px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; padding:2px 4px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); }
  .sync-dot.local{ background:var(--yellow); }

  /* Mobile nav */
  .mobile-topbar{ display:none; }
  nav.tabs.mobile-tabs{ display:none; }

  /* Main */
  main{ flex:1; min-width:0; padding:28px 34px 80px; }
  .content-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
  .content-head h2{ font-size:22px; font-weight:800; }
  .content-head .sub{ color:var(--ink-soft); font-size:13px; margin-top:4px; }

  .empty-state{
    border:none; border-radius:var(--radius-lg); padding:40px 20px; text-align:center; color:var(--ink-soft);
    background:var(--bg); box-shadow:var(--shadow-inset);
  }

  /* Character cards */
  .card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  .char-card{
    background:var(--bg); border:none; border-radius:var(--radius-md); padding:12px 14px;
    box-shadow:var(--shadow-sm), inset 5px 0 0 var(--cc,var(--accent)), var(--ring); display:flex; flex-direction:column; gap:6px;
    cursor:pointer; transition:box-shadow .15s ease, transform .12s ease;
    min-height:112px;
  }
  .char-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow), inset 5px 0 0 var(--cc,var(--accent)), var(--ring-hover); }
  .char-card .ch-top{ display:flex; align-items:center; gap:10px; }
  .ch-avatar{ width:34px; height:34px; border-radius:50%; background:var(--cc,var(--accent)); flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; }
  .ch-avatar-img{ width:34px; height:34px; border-radius:50%; object-fit:cover; flex:none; box-shadow:0 0 0 2px var(--cc,var(--accent)); }
  .rel-avatar{ width:22px; height:22px; border-radius:50%; object-fit:cover; flex:none; vertical-align:middle; box-shadow:0 0 0 2px var(--cc, rgba(0,0,0,.08)); }
  .rel-avatar-fallback{ width:22px; height:22px; border-radius:50%; flex:none; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:10.5px; vertical-align:middle; box-shadow:0 0 0 2px var(--cc, rgba(0,0,0,.12)); }
  .rel-pair{ display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:14.5px; color:var(--ink); }
  .char-card .ch-name{ font-weight:800; font-size:14.5px; line-height:1.3; }
  .ch-fullname{ font-size:11px; color:var(--ink-faint); margin-top:1px; }
  .ch-reading{ font-size:10.5px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ch-role{ font-size:10.5px; color:var(--ink-soft); background:var(--surface-2); display:inline-block; padding:1px 8px; border-radius:999px; align-self:flex-start; }
  .card-actions{ display:flex; justify-content:flex-end; gap:6px; margin-top:auto; padding-top:6px; }
  .updated-by{ font-size:10.5px; color:var(--ink-faint); margin-top:2px; }

  .char-view-toggle{ position:relative; display:flex; gap:2px; background:var(--bg); border-radius:999px; padding:4px; flex:none; box-shadow:var(--shadow-inset-sm); }
  .char-view-toggle .toggle-thumb{
    position:absolute; top:4px; left:4px; bottom:4px; border-radius:999px; background:var(--bg);
    box-shadow:var(--shadow-sm); transition:transform .28s cubic-bezier(.2,.8,.25,1), width .28s cubic-bezier(.2,.8,.25,1); z-index:0;
  }
  .char-view-toggle button{ position:relative; z-index:1; font-family:var(--font-body); font-size:12.5px; font-weight:700; padding:6px 14px; border-radius:999px; background:transparent; color:var(--ink-soft); transition:color .2s ease; }
  .char-view-toggle button.active{ color:var(--accent-deep); }

  .nickname-table-wrap{ overflow-x:auto; border:1px solid var(--line-strong); border-radius:var(--radius-sm); }
  .nickname-table{ width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  .nickname-table th, .nickname-table td{ border:1px solid var(--line-strong); padding:7px 10px; white-space:nowrap; }

    return fsDeleteDoc(fsDoc(fbDb,'projects',id));

  async softDeleteProject(id){ return fsUpdateDoc(fsDoc(fbDb,'projects',id), {deletedAt:Date.now(), deletedBy:nick()}); },
  async restoreProject(id){ return fsUpdateDoc(fsDoc(fbDb,'projects',id), {deletedAt:null, deletedBy:null}); },
  async estimateUsageBytes(){
    let total = 0;
    const projSnap = await fsGetDocs(fsCollection(fbDb, 'projects'));
    for (const pDoc of projSnap.docs){
      total += new Blob([JSON.stringify(pDoc.data())]).size;
      const subs = ['characters','relationships','timeline','world','plot','meta','schedule'];
      for (const s of subs){
        const subSnap = await fsGetDocs(fsCollection(fbDb, `projects/${pDoc.id}/${s}`));
        subSnap.docs.forEach(d=>{ total += new Blob([JSON.stringify(d.data())]).size; });
      }
    }
    return total;

function nick(){ return State.nickname.trim() || (currentUser && (currentUser.displayName || currentUser.email)) || 'ゲスト'; }
function el(tag, attrs, children){
  const node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(k=>{
    if (k==='class') node.className = attrs[k];
    else if (k==='html') node.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k]==='function') node.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] === true) node.setAttribute(k, '');
    else if (attrs[k] === false || attrs[k] === null || attrs[k] === undefined) { /* omit falsy boolean attrs (e.g. disabled) */ }
    else node.setAttribute(k, attrs[k]);
  });
  (children||[]).forEach(c=>{ if (c) node.appendChild(typeof c==='string' ? document.createTextNode(c) : c); });
  return node;
}
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

/* Prevent accidental clicks (tab switches, card opens, etc.) when the user was actually drag-selecting text */
(function(){
  let downX = 0, downY = 0;
  function recordDown(x, y){ downX = x; downY = y; }
  document.addEventListener('mousedown', (e)=> recordDown(e.clientX, e.clientY), true);
  document.addEventListener('touchstart', (e)=>{ const t = e.touches[0]; if (t) recordDown(t.clientX, t.clientY); }, true);
  document.addEventListener('click', (e)=>{
    const sel = window.getSelection && window.getSelection().toString();
    if (!sel) return;
    const dx = Math.abs(e.clientX - downX), dy = Math.abs(e.clientY - downY);
    if (dx > 4 || dy > 4){ e.stopPropagation(); e.preventDefault(); }
  }, true);
})();

const PARTICLE_COLORS = ['#6C4CF0','#E24E6B','#E8843F','#D6A72E','#4CAE50','#0FA394','#3F7FE0','#7C5CFC','#D6588C'];
function spawnParticles(originEl){
  const host = document.createElement('div');
  host.className = 'particle-host';
  if (originEl){
    const r = originEl.getBoundingClientRect();
    host.style.left = (r.left + r.width/2) + 'px';
    host.style.top = (r.top + r.height/2) + 'px';
  }
  document.body.appendChild(host);
  for (let i=0; i<16; i++){
    const p = document.createElement('span');
    const isTriangle = Math.random() < 0.5;
    const color = PARTICLE_COLORS[Math.floor(Math.random()*PARTICLE_COLORS.length)];
    const size = 14 + Math.random()*16;
    const angle = Math.random()*Math.PI*2;
    const dist = 70 + Math.random()*130;
    p.className = 'particle '+(isTriangle ? 'particle-triangle' : 'particle-square');
    p.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
    p.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
    p.style.setProperty('--rot', ((Math.random()*360)|0)+'deg');
    if (isTriangle){
      p.style.borderLeftWidth = (size/2)+'px';
      p.style.borderRightWidth = (size/2)+'px';
      p.style.borderBottomWidth = size+'px';
      p.style.borderBottomColor = color;
    } else {
      p.style.width = size+'px';
      p.style.height = size+'px';
      p.style.background = color;
    }
    host.appendChild(p);
  }
  setTimeout(()=> host.remove(), 700);
}
async function persistCustomOrder(sub, arr){
  await Promise.all(arr.map((item, idx)=> Store.updateDoc(State.currentProjectId, sub, item.id, {order:(idx+1)*10, updatedBy:nick()})));
}
function makeDraggableList(container, sortedItems, sub){
  let dragId = null;
  Array.from(container.children).forEach((row, idx)=>{
    const item = sortedItems[idx];
    if (!item) return;
    row.draggable = true;
    row.addEventListener('dragstart', ()=>{ dragId = item.id; row.classList.add('dragging'); });
    row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); });
    row.addEventListener('dragover', (e)=>{ e.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', ()=>{ row.classList.remove('drag-over'); });
    row.addEventListener('drop', (e)=>{
      e.preventDefault(); row.classList.remove('drag-over');
      if (!dragId || dragId === item.id) return;
      const fromIdx = sortedItems.findIndex(x=>x.id===dragId);
      const toIdx = sortedItems.findIndex(x=>x.id===item.id);
      if (fromIdx<0 || toIdx<0) return;
      const arr = [...sortedItems];
      const [moved] = arr.splice(fromIdx,1);
      arr.splice(toIdx,0,moved);
      persistCustomOrder(sub, arr);
    });
  });
}
function contrastColor(hex){
  try{
    const c = hex.replace('#','');
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    return ((r*299+g*587+b*114)/1000) > 150 ? '#2A2145' : '#FFFFFF';
  }catch(e){ return '#FFFFFF'; }
}
function hexToRgba(hex, alpha){
  try{
    const c = hex.replace('#','');
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }catch(e){ return `rgba(108,76,240,${alpha})`; }
}
function b64Bytes(dataUrl){
  if (!dataUrl) return 0;
  const idx = dataUrl.indexOf(',');
  const b64 = idx>=0 ? dataUrl.slice(idx+1) : dataUrl;
  return Math.round(b64.length*0.75);
}
function formatBytes(n){ return n < 1024 ? `${n}B` : `${Math.round(n/1024)}KB`; }
function resizeImageFile(file, maxW, maxH, maxBytes){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onerror = ()=> resolve(null);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> resolve(null);
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.naturalWidth, maxH/img.naturalHeight);
        const w = Math.max(1, Math.round(img.naturalWidth*scale)), h = Math.max(1, Math.round(img.naturalHeight*scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const pngUrl = canvas.toDataURL('image/png');
        if (pngUrl.length <= maxBytes*1.37){ resolve(pngUrl); return; }
        // Too large to keep as lossless PNG: flatten onto a neutral background and fall back to JPEG.
        ctx.globalCompositeOperation = 'destination-over';
        ctx.fillStyle = '#F4F3F1';
        ctx.fillRect(0, 0, w, h);
        let quality = 0.88, dataUrl = canvas.toDataURL('image/jpeg', quality);
        let attempts = 0;
        while (dataUrl.length > maxBytes*1.37 && attempts < 6){
          quality = Math.max(0.35, quality-0.15);
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          attempts++;
        }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function openImageCropper(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onerror = ()=> resolve(null);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> resolve(null);
      img.onload = ()=>{
        const VP = 280;
        const naturalW = img.naturalWidth, naturalH = img.naturalHeight;
        const baseScale = Math.max(VP/naturalW, VP/naturalH);
        let zoom = 1, offX = 0, offY = 0;

        lockBodyScroll();
        const back = el('div', {class:'modal-back', style:'z-index:160;'});
        const box = el('div', {class:'modal', style:'max-width:360px;'});
        const scrollHost = el('div', {class:'modal-scroll'});
        scrollHost.appendChild(el('h3', {}, ['画像の切り取り範囲を選択']));
        const viewport = el('div', {class:'crop-viewport', style:`width:${VP}px; height:${VP}px;`});
        const imgEl = el('img', {class:'crop-img', src: reader.result, draggable:false});
        viewport.appendChild(imgEl);
        scrollHost.appendChild(el('div', {style:'display:flex; justify-content:center;'}, [viewport]));

        function clampOffset(){
          const scale = baseScale*zoom;
          const w = naturalW*scale, h = naturalH*scale;
          offX = Math.min(0, Math.max(VP-w, offX));
          offY = Math.min(0, Math.max(VP-h, offY));
        }
        function applyTransform(){
          const scale = baseScale*zoom;
          imgEl.style.width = (naturalW*scale)+'px';
          imgEl.style.height = (naturalH*scale)+'px';
          imgEl.style.left = offX+'px';
          imgEl.style.top = offY+'px';
        }
        offX = (VP - naturalW*baseScale)/2;
        offY = (VP - naturalH*baseScale)/2;
        clampOffset(); applyTransform();

        let dragging=false, startX=0, startY=0, startOffX=0, startOffY=0;
        function pointerDown(e){
          dragging = true;
          const pt = e.touches ? e.touches[0] : e;
          startX = pt.clientX; startY = pt.clientY; startOffX = offX; startOffY = offY;
          e.preventDefault();
        }
        function pointerMove(e){
          if (!dragging) return;
          const pt = e.touches ? e.touches[0] : e;
          offX = startOffX + (pt.clientX - startX);
          offY = startOffY + (pt.clientY - startY);
          clampOffset(); applyTransform();
        }
        function pointerUp(){ dragging = false; }
        viewport.addEventListener('mousedown', pointerDown);
        window.addEventListener('mousemove', pointerMove);
        window.addEventListener('mouseup', pointerUp);
        viewport.addEventListener('touchstart', pointerDown, {passive:false});
        window.addEventListener('touchmove', pointerMove, {passive:false});
        window.addEventListener('touchend', pointerUp);

        const zoomRow = el('div', {style:'display:flex; align-items:center; gap:10px; margin-top:14px;'});
        zoomRow.appendChild(el('span', {style:'font-size:12px; color:var(--ink-soft); flex:none;'}, ['拡大']));
        const zoomInput = el('input', {type:'range', class:'zoom-range', min:'1', max:'3', step:'0.01'});
        zoomInput.value = '1';
        zoomInput.addEventListener('input', ()=>{ zoom = parseFloat(zoomInput.value); clampOffset(); applyTransform(); });
        zoomRow.appendChild(zoomInput);
        scrollHost.appendChild(zoomRow);
        scrollHost.appendChild(el('div', {class:'hint', style:'text-align:center; margin-top:4px;'}, ['ドラッグで位置調整、スライダーで拡大縮小できます']));

        function cleanup(){
          window.removeEventListener('mousemove', pointerMove);
          window.removeEventListener('mouseup', pointerUp);
          window.removeEventListener('touchmove', pointerMove);
          window.removeEventListener('touchend', pointerUp);
          back.remove();
          unlockBodyScroll();
        }
        const foot = el('div', {class:'modal-foot'});
        foot.appendChild(el('button', {class:'btn', onclick:()=>{ cleanup(); resolve(null); }}, ['キャンセル']));
        foot.appendChild(el('button', {class:'btn btn-primary', onclick:()=>{
          const scale = baseScale*zoom;
          const srcX = -offX/scale, srcY = -offY/scale, srcSize = VP/scale;
          const outSize = 420, maxBytes = 120000;
          const canvas = document.createElement('canvas');
          canvas.width = outSize; canvas.height = outSize;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, srcX, srcY, srcSize, srcSize, 0, 0, outSize, outSize);
          let quality = 0.86, dataUrl = canvas.toDataURL('image/jpeg', quality);
          let attempts = 0;
          while (dataUrl.length > maxBytes*1.37 && attempts < 6){
            quality = Math.max(0.35, quality-0.15);
            dataUrl = canvas.toDataURL('image/jpeg', quality);
            attempts++;
          }
          cleanup();
          resolve(dataUrl);
        }}, ['この範囲で決定']));
        box.appendChild(scrollHost);
        box.appendChild(foot);
        back.appendChild(box);
        document.body.appendChild(back);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============================= MODAL / FORM BUILDER ============================= */
let modalStackCount = 0;
function lockBodyScroll(){ modalStackCount++; document.body.style.overflow = 'hidden'; }
function unlockBodyScroll(){ modalStackCount = Math.max(0, modalStackCount-1); if (modalStackCount===0) document.body.style.overflow = ''; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; unlockBodyScroll(); }
function confirmDialog(message){
  return new Promise((resolve)=>{
    lockBodyScroll();
    const back = el('div', {class:'modal-back', style:'z-index:150;'});
    const box = el('div', {class:'modal', style:'max-width:360px;'});
    const scrollHost = el('div', {class:'modal-scroll'});
    scrollHost.appendChild(el('div', {style:'font-size:14.5px; line-height:1.6; color:var(--ink);'}, [message]));
    const foot = el('div', {class:'modal-foot'});
    foot.appendChild(el('button', {class:'btn', onclick:()=>{ back.remove(); unlockBodyScroll(); resolve(false); }}, ['キャンセル']));
    foot.appendChild(el('button', {class:'btn btn-danger', onclick:()=>{ back.remove(); unlockBodyScroll(); resolve(true); }}, ['削除する']));
    box.appendChild(scrollHost);
    box.appendChild(foot);
    back.appendChild(box);
    document.body.appendChild(back);
  });
}
function openForm({title, fields, initial, submitLabel, onSubmit, onDelete, celebrate, onReady, wide}){
  initial = initial || {};
  const root = document.getElementById('modalRoot');
  root.innerHTML = '';
  lockBodyScroll();
  const back = el('div', {class:'modal-back', onclick:(e)=>{ if(e.target===back) closeModal(); }});
  const modal = el('div', {class:'modal'+(wide?' modal-wide':'')});
  const scrollHost = el('div', {class:'modal-scroll'});
  scrollHost.appendChild(el('h3', {}, [title]));
  const fieldsHost = wide ? el('div', {class:'form-grid'}) : scrollHost;
  const FULL_WIDTH_TYPES = ['textarea','image','imageList','color','palette','multiselect','tags','pair'];

  const fieldRefs = {};
  const imageSizeGetters = [];
  const imageTotalEl = el('div', {class:'image-total-meter'});
  const IMAGE_TOTAL_SAFE_BYTES = 850000;
  function refreshImageTotal(){
    const total = imageSizeGetters.reduce((sum,fn)=> sum + fn(), 0);
    const over = total > IMAGE_TOTAL_SAFE_BYTES;
    imageTotalEl.textContent = `画像合計 約${formatBytes(total)}（このキャラの保存データ全体の目安上限は約${formatBytes(IMAGE_TOTAL_SAFE_BYTES)}）` + (over ? ' — 超過すると保存に失敗する可能性があります' : '');
    imageTotalEl.classList.toggle('over', over);
  }
  fields.forEach(f=>{
    if (f.section){
      const heading = el('div', {class:'form-section-title'}, [f.section]);
      fieldsHost.appendChild(heading);
      return;
    }
    const wrap = el('label', {class:'field'+(f.narrow?' field-narrow':'')}, [el('span', {}, [f.label])]);
    if (wide && (FULL_WIDTH_TYPES.includes(f.type) || f.full)) wrap.style.gridColumn = '1 / -1';
    let input;
    if (f.type==='pair'){
      const rowWrap = el('div', {style:'display:flex; gap:10px;'});
      f.fields.forEach(sub=>{
        const subInput = el('input', {type: sub.type||'text', placeholder: sub.placeholder||'', style:'flex:1; min-width:0;'});
        subInput.value = initial[sub.key] ?? '';
        fieldRefs[sub.key] = subInput;
        rowWrap.appendChild(subInput);
      });
      wrap.appendChild(rowWrap);
      if (f.hint) wrap.appendChild(el('div', {class:'hint'}, [f.hint]));
      fieldsHost.appendChild(wrap);
      return;
    } else if (f.type==='textarea'){
      input = el('textarea', {rows: f.rows||3, placeholder: f.placeholder||''});
      input.value = initial[f.key] || '';
    } else if (f.type==='select'){
      input = el('select', {});
      (f.options||[]).forEach(o=>{
        const opt = el('option', {value:o.value}, [o.label]);
        if ((initial[f.key] ?? f.default) === o.value) opt.setAttribute('selected','selected');
        input.appendChild(opt);
      });
    } else if (f.type==='combo'){
      input = el('input', {type:'text', placeholder: f.placeholder||''});
      input.value = initial[f.key] ?? (f.default ?? '');
      wrap.appendChild(input);
      const chipBox = el('div', {class:'suggest-chips'});
      (f.options||[]).forEach(o=>{
        chipBox.appendChild(el('button', {type:'button', class:'suggest-chip', onclick:()=>{ input.value = o.value; input.focus(); }}, [o.value]));
      });
      wrap.appendChild(chipBox);
      if (f.hint) wrap.appendChild(el('div', {class:'hint'}, [f.hint]));
      fieldRefs[f.key] = input;
      fieldsHost.appendChild(wrap);
      return;
    } else if (f.type==='image'){
      let currentVal = initial[f.key] || '';
      const preview = el('div', {class:'image-preview'});
      const sizeCaption = el('div', {class:'image-size-caption'});
      function renderPreview(){
        preview.innerHTML = '';
        if (currentVal){ preview.appendChild(el('img', {src:currentVal})); sizeCaption.textContent = formatBytes(b64Bytes(currentVal)); }
        else { preview.appendChild(el('span', {class:'image-preview-empty'}, ['画像なし'])); sizeCaption.textContent = ''; }
        refreshImageTotal();
      }
      imageSizeGetters.push(()=> b64Bytes(currentVal));
      renderPreview();
      const fileInput = el('input', {type:'file', accept:'image/*'});
      fileInput.addEventListener('change', async ()=>{
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        try{
          const result = f.crop===false ? await resizeImageFile(file, f.maxW||640, f.maxH||900, f.maxBytes||200000) : await openImageCropper(file);
          if (result){ currentVal = result; renderPreview(); }
        }
        catch(e){ toast('画像の読み込みに失敗しました'); }
        finally { fileInput.value = ''; }
      });
      const clearBtn = el('button', {type:'button', class:'btn btn-sm', onclick:()=>{ currentVal=''; fileInput.value=''; renderPreview(); }}, ['画像を削除']);
      const rowWrap = el('div', {class:'image-field-row'}, [preview, el('div', {class:'image-field-controls'}, [fileInput, clearBtn, sizeCaption])]);
      wrap.appendChild(rowWrap);
      if (f.hint) wrap.appendChild(el('div', {class:'hint'}, [f.hint]));
      fieldRefs[f.key] = { get value(){ return currentVal; } };
      fieldsHost.appendChild(wrap);
      return;
    } else if (f.type==='imageList'){
      let currentList = Array.isArray(initial[f.key]) ? [...initial[f.key]] : [];
      const grid = el('div', {class:'image-list-grid'});
      imageSizeGetters.push(()=> currentList.reduce((sum,img)=> sum + b64Bytes(img), 0));
      function renderList(){
        grid.innerHTML = '';
        currentList.forEach((img, idx)=>{
          const item = el('div', {class:'image-list-item'});
          item.appendChild(el('img', {src:img}));
          item.appendChild(el('div', {class:'image-list-size'}, [formatBytes(b64Bytes(img))]));
          item.appendChild(el('button', {type:'button', class:'image-list-remove', onclick:()=>{ currentList.splice(idx,1); renderList(); }}, ['×']));
          grid.appendChild(item);
        });
        const addLabel = el('label', {class:'image-list-add'}, ['＋']);
        const addInput = el('input', {type:'file', accept:'image/*', multiple:true, style:'display:none;'});
        addInput.addEventListener('change', async ()=>{
          const files = Array.from(addInput.files || []);
          for (const file of files){
            try{
              const result = f.crop===false ? await resizeImageFile(file, f.maxW||700, f.maxH||900, f.maxBytes||300000) : await openImageCropper(file);
              if (result) currentList.push(result);
            }catch(e){ toast('画像の読み込みに失敗しました'); }
          }
          addInput.value = '';
          renderList();
        });
        addLabel.appendChild(addInput);
        grid.appendChild(addLabel);
        refreshImageTotal();
      }
      renderList();
      wrap.appendChild(grid);
      if (f.hint) wrap.appendChild(el('div', {class:'hint'}, [f.hint]));
      fieldRefs[f.key] = { get value(){ return currentList; } };
      fieldsHost.appendChild(wrap);
      return;
    } else if (f.type==='color'){
      const rowWrap = el('div', {class:'color-row'});
      const colorInput = el('input', {type:'color', style:'display:none;'});
      colorInput.value = initial[f.key] || f.default || '#6C4CF0';
      const hexInput = el('input', {type:'text', class:'hexcode-input', placeholder:'#RRGGBB', maxlength:7});
      hexInput.value = colorInput.value.toUpperCase();
      const swatches = el('div', {class:'swatches'});
      function syncSwatches(){
        swatches.querySelectorAll('.swatch').forEach(s=> s.classList.toggle('active', s.title.toLowerCase()===colorInput.value.toLowerCase()));
      }
      function setColor(hex){
        colorInput.value = hex; hexInput.value = hex.toUpperCase(); syncSwatches();
      }
      PRESET_COLORS.forEach(c=>{
        const sw = el('div', {class:'swatch'+(c.toLowerCase()===colorInput.value.toLowerCase()?' active':''), title:c, onclick:()=> setColor(c)});
        sw.style.background = c;
        swatches.appendChild(sw);
      });
      colorInput.addEventListener('input', ()=>{ hexInput.value = colorInput.value.toUpperCase(); syncSwatches(); });
      function applyHexInput(){
        let v = hexInput.value.trim();
        if (v && !v.startsWith('#')) v = '#'+v;
        if (/^#[0-9A-Fa-f]{6}$/.test(v)) setColor(v);
        else hexInput.value = colorInput.value.toUpperCase();
      }
      hexInput.addEventListener('change', applyHexInput);
      hexInput.addEventListener('keydown', (e)=>{ if (e.key==='Enter'){ e.preventDefault(); applyHexInput(); } });
      rowWrap.appendChild(swatches); rowWrap.appendChild(colorInput); rowWrap.appendChild(hexInput);
      wrap.appendChild(rowWrap);
      fieldRefs[f.key] = { get value(){ return colorInput.value; } };
      fieldsHost.appendChild(wrap);
      return;
    } else if (f.type==='palette'){
      const state = PALETTE_ROLES.map(r=>({
        key:r.key, pctKey:r.pctKey, label:r.label,
        color: initial[r.key] || r.def,
        pct: initial[r.pctKey] != null ? initial[r.pctKey] : r.defPct
      }));
      const barEl = el('div', {class:'palette-bar'});
      function refreshBar(){
        barEl.innerHTML = '';
        const total = state.reduce((s,r)=> s + Math.max(r.pct,0), 0) || 1;
        state.forEach(r=>{
          barEl.appendChild(el('div', {class:'palette-bar-seg', style:`background:${r.color}; width:${Math.max(r.pct,0)/total*100}%;`}));
        });
      }
      const totalEl = el('div', {class:'palette-total'});
      function refreshTotal(){
        const total = state.reduce((s,r)=> s + Math.max(r.pct,0), 0);
        totalEl.textContent = `合計 ${total}%`;
        totalEl.classList.toggle('warn', total !== 100);
      }
      const rolesHost = el('div', {class:'palette-roles'});
      state.forEach(r=>{
        const roleBlock = el('div', {class:'palette-role-block'});
        const topRow = el('div', {class:'palette-role-top'});
        topRow.appendChild(el('span', {class:'palette-role-label'}, [r.label]));
        const swatchBtn = el('div', {class:'palette-swatch', style:`background:${r.color};`});
        const hexInput = el('input', {type:'text', class:'hexcode-input palette-hex', maxlength:7});
        hexInput.value = r.color.toUpperCase();
        hexInput.addEventListener('change', ()=>{
          let v = hexInput.value.trim();
          if (v && !v.startsWith('#')) v = '#'+v;
          if (/^#[0-9A-Fa-f]{6}$/.test(v)){ r.color = v; swatchBtn.style.background = v; hexInput.value = v.toUpperCase(); refreshBar(); }
          else hexInput.value = r.color.toUpperCase();
        });
        topRow.appendChild(swatchBtn);
        topRow.appendChild(hexInput);
        roleBlock.appendChild(topRow);
        const sliderRow = el('div', {class:'palette-role-slider-row'});
        const pctSlider = el('input', {type:'range', class:'zoom-range palette-pct-slider', min:'0', max:'100', step:'1'});
        pctSlider.value = r.pct;
        const pctReadout = el('input', {type:'number', class:'palette-pct-readout', min:'0', max:'100'});
        pctReadout.value = r.pct;
        pctSlider.addEventListener('input', ()=>{
          r.pct = parseInt(pctSlider.value)||0; pctReadout.value = r.pct; refreshBar(); refreshTotal();
        });
        pctReadout.addEventListener('input', ()=>{
          r.pct = Math.max(0, Math.min(100, parseInt(pctReadout.value)||0)); pctSlider.value = r.pct; refreshBar(); refreshTotal();
        });
        sliderRow.appendChild(pctSlider);
        sliderRow.appendChild(pctReadout);
        sliderRow.appendChild(el('span', {class:'palette-pct-suffix'}, ['%']));
        roleBlock.appendChild(sliderRow);
        rolesHost.appendChild(roleBlock);
      });
      refreshBar();
      refreshTotal();
      wrap.appendChild(barEl);
      wrap.appendChild(rolesHost);
      wrap.appendChild(totalEl);
      if (f.hint) wrap.appendChild(el('div', {class:'hint'}, [f.hint]));
      state.forEach(r=>{
        fieldRefs[r.key] = { get value(){ return r.color; } };
        fieldRefs[r.pctKey] = { get value(){ return r.pct; } };
      });
      fieldsHost.appendChild(wrap);
      return;
    } else if (f.type==='checkbox'){
      const rowWrap = el('div', {style:'display:flex;align-items:center;gap:8px;'});
      input = el('input', {type:'checkbox'});
      input.style.width = 'auto';
      input.checked = !!initial[f.key];
      rowWrap.appendChild(input);
      wrap.appendChild(rowWrap);
      fieldRefs[f.key] = input;
      fieldsHost.appendChild(wrap);
      return;
    } else if (f.type==='multiselect'){
      const box = el('div', {class:'multiselect-box'});
      const selected = new Set(initial[f.key] || []);
      (f.options||[]).forEach(o=>{
        const chip = el('div', {class:'ms-chip'+(selected.has(o.value)?' on':''), onclick:()=>{
          if (selected.has(o.value)){ selected.delete(o.value); chip.classList.remove('on'); }
          else { selected.add(o.value); chip.classList.add('on'); }
        }}, [o.label]);
        box.appendChild(chip);
      });
      wrap.appendChild(box);
      fieldRefs[f.key] = { get value(){ return Array.from(selected); } };
      fieldsHost.appendChild(wrap);
      if (f.hint) wrap.appendChild(el('div', {class:'hint'}, [f.hint]));
      return;
    } else if (f.type==='tags'){
      const selected = new Set(initial[f.key] || (initial.role ? [initial.role] : []));
      const box = el('div', {class:'multiselect-box'});
      function renderChips(){
        box.innerHTML = '';
        const allOptions = Array.from(new Set([...(f.options||[]), ...selected]));
        allOptions.forEach(v=>{
          const chip = el('div', {class:'ms-chip'+(selected.has(v)?' on':''), onclick:()=>{
            if (selected.has(v)) selected.delete(v); else selected.add(v);
            renderChips();
          }}, [v]);
          box.appendChild(chip);
        });
      }
      renderChips();
      wrap.appendChild(box);
      const addRow = el('div', {class:'tag-add-row'});
      const addInput = el('input', {type:'text', placeholder:'新しい役割を入力してEnter'});
      const addBtn = el('button', {type:'button', class:'btn btn-sm'}, ['追加']);
      function addTag(){
        const v = addInput.value.trim();
        if (!v) return;
        selected.add(v);
        addInput.value = '';
        renderChips();
      }
      addBtn.addEventListener('click', addTag);
      addInput.addEventListener('keydown', (e)=>{ if (e.key==='Enter'){ e.preventDefault(); addTag(); } });
      addRow.appendChild(addInput); addRow.appendChild(addBtn);
      wrap.appendChild(addRow);
      if (f.hint) wrap.appendChild(el('div', {class:'hint'}, [f.hint]));
      fieldRefs[f.key] = { get value(){ return Array.from(selected); } };
      fieldsHost.appendChild(wrap);
      return;
    } else {
      input = el('input', {type: f.type||'text', placeholder: f.placeholder||''});
      input.value = initial[f.key] ?? (f.default ?? '');
    }
    wrap.appendChild(input);
    if (f.hint) wrap.appendChild(el('div', {class:'hint'}, [f.hint]));
    fieldRefs[f.key] = input;
    fieldsHost.appendChild(wrap);
  });
  if (wide) scrollHost.appendChild(fieldsHost);
  if (imageSizeGetters.length){ refreshImageTotal(); scrollHost.appendChild(imageTotalEl); }

  if (onReady) onReady(fieldRefs, modal);

  const foot = el('div', {class:'modal-foot'});
  if (onDelete){
    foot.appendChild(el('button', {class:'btn btn-danger', onclick: async ()=>{
      if (await confirmDialog('本当に削除しますか？この操作は取り消せません。')){ onDelete(); closeModal(); }
    }}, ['削除']));
    foot.appendChild(el('div', {style:'flex:1'}));
  }
  foot.appendChild(el('button', {class:'btn', onclick: closeModal}, ['キャンセル']));
  const submitBtn = el('button', {class:'btn btn-primary', onclick:()=>{
    const out = {};
    fields.forEach(f=>{
      if (f.section) return;
      if (f.type==='pair'){ f.fields.forEach(sub=>{ const v = fieldRefs[sub.key].value; out[sub.key] = sub.type==='number' ? (v===''?null:Number(v)) : v; }); return; }
      if (f.type==='palette'){ PALETTE_ROLES.forEach(r=>{ out[r.key] = fieldRefs[r.key].value; out[r.pctKey] = fieldRefs[r.pctKey].value; }); return; }
      const ref = fieldRefs[f.key];
      if (f.type==='checkbox') out[f.key] = !!ref.checked;
      else if (f.type==='number') out[f.key] = ref.value===''? null : Number(ref.value);
      else out[f.key] = ref.value;
    });
    if (celebrate) spawnParticles(submitBtn);
    Promise.resolve(onSubmit(out)).catch(err=>{
      console.error(err);
      toast('保存に失敗しました。画像が大きすぎる可能性があります');
    });
    closeModal();
  }}, [submitLabel || '保存']);
  foot.appendChild(submitBtn);
  modal.appendChild(scrollHost);
  modal.appendChild(foot);
  modal.addEventListener('keydown', (e)=>{
    if (e.key !== 'Enter' || e.defaultPrevented) return;
    const tag = e.target.tagName;
    if (tag === 'TEXTAREA' || tag === 'BUTTON') return;
    e.preventDefault();
    submitBtn.click();
  });
  back.appendChild(modal);
  root.appendChild(back);
}

/* ============================= GATE (project picker) ============================= */
function renderGate(){
  const grid = document.getElementById('projectGrid');
  grid.innerHTML = '';
  grid.appendChild(el('div', {class:'project-card project-new fade-in', onclick:()=>openProjectForm(null)}, [
    el('div', {class:'plus'}, ['＋']),
    el('div', {}, ['新しい作品を作る'])
  ]));
  State.projects.forEach((p, i)=>{
    const editBtn = el('button', {class:'pmeta-btn', onclick:(e)=>{ e.stopPropagation(); openProjectForm(p); }}, ['編集']);
    const delBtn = el('button', {class:'pmeta-btn', onclick: async (e)=>{
      e.stopPropagation();
      if (await confirmDialog(`「${p.name}」をゴミ箱に移動します。中のキャラクターや設定は保持されます。よろしいですか？`)){
        await Store.softDeleteProject(p.id);
        toast('作品をゴミ箱に移動しました');
      }
    }}, ['削除']);
    const card = el('div', {class:'project-card fade-in', style:`--pc:${p.color||'#6C4CF0'}; animation-delay:${(i+1)*40}ms`, onclick:()=>enterProject(p.id)}, [
      el('div', {class:'pname'}, [p.name || '(無題の作品)']),
      el('div', {class:'pdesc'}, [p.description || '説明はまだありません']),
      el('div', {class:'pmeta'}, [editBtn, delBtn])
    ]);
    grid.appendChild(card);
  });
  const trashHost = document.getElementById('projectTrash');
  trashHost.innerHTML = '';

function unsubscribeSub(){ State.unsubs.forEach(u=>{ try{u&&u();}catch(e){} }); State.unsubs = []; }
function subscribeSub(pid){
  unsubscribeSub();
  ['characters','relationships','timeline','world','plot','meta','schedule'].forEach(sub=>{
    const un = Store.watchSub(pid, sub, (list)=>{
      State.data[sub] = list.filter(x=>!x.deletedAt);
      State.trash[sub] = list.filter(x=>x.deletedAt);
      renderActiveView();
      runChecks();
      updateTrashBadge();
    });
    State.unsubs.push(un);
  });
}

const toggleThumbCache = {};
function buildViewToggle(id, options, activeValue, onChange){
  const wrap = el('div', {class:'char-view-toggle'});
  const thumb = el('div', {class:'toggle-thumb'});
  const cached = toggleThumbCache[id];
  if (cached){
    thumb.style.transition = 'none';
    thumb.style.width = cached.width+'px';
    thumb.style.transform = `translateX(${cached.x}px)`;
  }
  wrap.appendChild(thumb);
  const btns = [];
  options.forEach(o=>{
    const b = el('button', {type:'button', class: o.value===activeValue ? 'active' : '', onclick:()=> onChange(o.value)}, [o.label]);
    wrap.appendChild(b);
    btns.push(b);
  });
  function positionThumb(){
    const idx = options.findIndex(o=>o.value===activeValue);
    const activeBtn = btns[idx];
    if (!activeBtn) return;
    const width = activeBtn.offsetWidth, x = activeBtn.offsetLeft-4;
    if (cached){ void thumb.offsetWidth; thumb.style.transition = ''; }
    thumb.style.width = width+'px';
    thumb.style.transform = `translateX(${x}px)`;
    toggleThumbCache[id] = {width, x};
  }
  requestAnimationFrame(positionThumb);
  return wrap;
}

const ROLE_OPTIONS = [
  {value:'主人公'}, {value:'ヒロイン'}, {value:'仲間'}, {value:'敵役'}, {value:'脇役'}, {value:'その他'}
];
const CHARACTER_SORTS = [['created','登録順（追加した順）'], ['name','名前順（あいうえお順）'], ['role','役割順'], ['custom','カスタム']];
function charById(id){ return State.data.characters.find(c=>c.id===id); }
function charReading(c){ return [c.surnameReading, c.givenNameReading].filter(Boolean).join(' '); }
function charFullName(c){ return [c.surname, c.givenName, c.middleName].filter(Boolean).join(' '); }
function charRoles(c){ return Array.isArray(c.roles) && c.roles.length ? c.roles : (c.role ? [c.role] : []); }
function projectRoleOptions(){
  const set = new Set(ROLE_OPTIONS.map(o=>o.value));
  State.data.characters.forEach(c=> charRoles(c).forEach(r=> set.add(r)));
  return Array.from(set);
}
function charRolesSorted(c){
  const order = projectRoleOptions();
  return [...charRoles(c)].sort((a,b)=>{
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia<0?999:ia) - (ib<0?999:ib);
  });
}
function charBirthYear(c){ return c.birthYear!=null ? c.birthYear : extractYear(c.birth); }
function charDeathYear(c){ return c.deathYear!=null ? c.deathYear : extractYear(c.death); }
function charAge(c){ return c.age!=null ? c.age : null; }
let charViewMode = 'list';
let charSortKey = 'custom';
let charSearchText = '';
function sortCharacters(list){
  const out = [...list];
  if (charSortKey === 'name') out.sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'ja'));
  else if (charSortKey === 'role') out.sort((a,b)=> charRoles(a).join('、').localeCompare(charRoles(b).join('、'), 'ja'));
  else if (charSortKey === 'custom') out.sort((a,b)=> (a.order??0)-(b.order??0));
  return out;
}
function filterCharacters(list){
  const q = charSearchText.trim().toLowerCase();
  return list.filter(c=>{
    if (!q) return true;
    const hay = [c.name, charReading(c), ...charRoles(c), c.affiliation, c.personality, c.background, c.notes].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
}

            kanaInput.value = lastKana;
            kanaInput.dispatchEvent(new Event('input'));

          lastKana = '';
        });

/* ============================= RELATIONSHIPS ============================= */
const FAVOR_OPTIONS = [
  {value:'positive', label:'好意的 ・ 友好'}, {value:'negative', label:'敵対的 ・ 対立'},
  {value:'complex', label:'複雑 ・ 両面的'}, {value:'neutral', label:'中立 ・ その他'}
];
const FAVOR_COLOR = { positive:'#1FA070', negative:'#E24E6B', complex:'#7C5CFC', neutral:'#9C97AE' };
const FAVOR_LABEL = { positive:'好意的', negative:'敵対的', complex:'複雑', neutral:'中立' };
const FAVOR_ORDER = { positive:0, complex:1, neutral:2, negative:3 };
const RELATIONSHIP_SORTS = [['created','登録順（追加した順）'], ['nameA','キャラクターA名順（あいうえお順）'], ['favor','感情の方向順（好意的→複雑→中立→敵対的）'], ['custom','カスタム']];
let relSortKey = 'custom';
function sortRelationships(list){
  const out = [...list];
  if (relSortKey === 'nameA'){
    out.sort((a,b)=> (charById(a.fromId)?.name||'').localeCompare(charById(b.fromId)?.name||'', 'ja'));
  } else if (relSortKey === 'favor'){
    out.sort((a,b)=> (FAVOR_ORDER[a.favor] ?? 9) - (FAVOR_ORDER[b.favor] ?? 9));
  } else if (relSortKey === 'custom'){
    out.sort((a,b)=> (a.order??0) - (b.order??0));
  }
  return out;
}
async function moveRelationship(sorted, idx, dir){
  const other = sorted[idx+dir], cur = sorted[idx];
  if (!other) return;
  const a = cur.order ?? 0, b = other.order ?? 0;
  await Store.updateDoc(State.currentProjectId, 'relationships', cur.id, {order:b, updatedBy:nick()});
  await Store.updateDoc(State.currentProjectId, 'relationships', other.id, {order:a, updatedBy:nick()});
}

let relViewMode = 'diagram';

        r.type ? el('span', {class:'tag cat'}, [r.type]) : null,
        el('span', {class:'favor-chip favor-'+r.favor}, [FAVOR_LABEL[r.favor]||r.favor]),

      ]),

    list.appendChild(row);

function buildRelationshipDiagram(){
  const wrap = el('div', {class:'diagram-wrap fade-in'});
  const chars = State.data.characters;
  const n = Math.max(chars.length, 1);
  const R = Math.min(340, Math.max(140, 60 + n * 16));
  const W = Math.round(R*2 + 180), H = Math.round(R*2 + 140);
  const cx = W/2, cy = H/2;
  const pos = {};
  chars.forEach((c,i)=>{
    const angle = (i / chars.length) * Math.PI*2 - Math.PI/2;
    pos[c.id] = { x: cx + R*Math.cos(angle), y: cy + R*Math.sin(angle) };
  });
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans JP, sans-serif">`;
  svg += '<defs>';
  Object.keys(FAVOR_COLOR).forEach(key=>{
    svg += `<marker id="arrow-${key}" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1L6,5L0,9z" fill="${FAVOR_COLOR[key]}" /></marker>`;
  });
  svg += '</defs>';
  const pairGroups = {};
  State.data.relationships.forEach(r=>{
    if (!pos[r.fromId] || !pos[r.toId]) return;
    const key = [r.fromId, r.toId].sort().join('|');
    (pairGroups[key] = pairGroups[key]||[]).push(r);
  });
  const NODE_R = 30;
  Object.values(pairGroups).forEach(list=>{
    const n = list.length;
    list.forEach((r,idx)=>{
      const a = pos[r.fromId], b = pos[r.toId];
      const color = FAVOR_COLOR[r.favor] || FAVOR_COLOR.neutral;
      const markerId = r.favor && FAVOR_COLOR[r.favor] ? r.favor : 'neutral';
      const markers = r.mutual
        ? `marker-start="url(#arrow-${markerId})" marker-end="url(#arrow-${markerId})"`
        : `marker-end="url(#arrow-${markerId})"`;
      if (n === 1){
        const dx = b.x-a.x, dy = b.y-a.y, len = Math.sqrt(dx*dx+dy*dy) || 1;
        const ux = dx/len, uy = dy/len;
        const sx = a.x+ux*NODE_R, sy = a.y+uy*NODE_R;
        const ex = b.x-ux*NODE_R, ey = b.y-uy*NODE_R;
        svg += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-width="2.5" stroke-linecap="round" ${markers} />`;
      } else {
        const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
        const dx = b.x-a.x, dy = b.y-a.y;
        const len = Math.sqrt(dx*dx+dy*dy) || 1;
        const nx = -dy/len, ny = dx/len;
        const side = (idx % 2 === 0) ? 1 : -1;
        const magnitude = 20 * (Math.floor(idx/2) + 1);
        const cxp = mx + nx*magnitude*side, cyp = my + ny*magnitude*side;
        const dxs = cxp-a.x, dys = cyp-a.y, lens = Math.sqrt(dxs*dxs+dys*dys) || 1;
        const sx = a.x + (dxs/lens)*NODE_R, sy = a.y + (dys/lens)*NODE_R;
        const dxe = b.x-cxp, dye = b.y-cyp, lene = Math.sqrt(dxe*dxe+dye*dye) || 1;
        const ex = b.x - (dxe/lene)*NODE_R, ey = b.y - (dye/lene)*NODE_R;
        svg += `<path d="M${sx},${sy} Q${cxp},${cyp} ${ex},${ey}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" ${markers} />`;
      }
    });
  });
  chars.forEach(c=>{
    const p = pos[c.id];
    const color = c.color || '#6C4CF0';
    const tColor = contrastColor(color);
    if (c.image){
      const clipId = 'clip-'+c.id;
      svg += `<defs><clipPath id="${clipId}"><circle cx="${p.x}" cy="${p.y}" r="23" /></clipPath></defs>`;
      svg += `<image href="${c.image}" x="${p.x-26}" y="${p.y-26}" width="52" height="52" clip-path="url(#${clipId})" preserveAspectRatio="xMidYMid slice" />`;
      svg += `<circle cx="${p.x}" cy="${p.y}" r="23" fill="none" stroke="${color}" stroke-width="3.5" />`;
    } else {
      svg += `<circle cx="${p.x}" cy="${p.y}" r="26" fill="${color}" stroke="#FFFFFF" stroke-width="3" />`;
      svg += `<text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="16" font-weight="800" fill="${tColor}">${esc((c.name||'?').charAt(0))}</text>`;
    }
    const labelY = p.y + (p.y > cy ? 44 : -36);
    svg += `<text x="${p.x}" y="${labelY}" text-anchor="middle" font-size="13" font-weight="800" fill="#211B3D" style="paint-order:stroke; stroke:#F1F2F7; stroke-width:5px; stroke-linejoin:round;">${esc(c.name||'')}</text>`;
  });
  svg += `</svg>`;
  const svgBox = el('div', {class:'diagram-svg-box'});
  svgBox.innerHTML = svg;
  wrap.appendChild(svgBox);
  const legend = el('div', {class:'legend'}, [
    el('span',{},[el('i',{style:'background:#1FA070'}),'好意的']),
    el('span',{},[el('i',{style:'background:#E24E6B'}),'敵対的']),
    el('span',{},[el('i',{style:'background:#7C5CFC'}),'複雑']),
    el('span',{},[el('i',{style:'background:#9C97AE'}),'中立']),
    el('span',{},['矢印は関係の向き（両端に矢印＝相互）'])
  ]);
  wrap.appendChild(legend);
  return wrap;
}
function openRelationshipForm(existing){
  const charOpts = [{value:'', label:'選択してください'}, ...State.data.characters.map(c=>({value:c.id, label:c.name||'(無名)'}))];
  openForm({
    title: existing ? '関係性を編集' : '新しい関係性',
    submitLabel: existing ? '保存する' : '追加する',
    celebrate: !existing,
    initial: existing || {},
    fields: [
      {key:'fromId', label:'キャラクターA', type:'select', options:charOpts},
      {key:'toId', label:'キャラクターB', type:'select', options:charOpts},
      {key:'type', label:'関係の種類（自由記述）', type:'text', placeholder:'例: 幼なじみ / 師弟 / 家族 など'},
      {key:'favor', label:'感情の方向', type:'select', options:FAVOR_OPTIONS, default:'neutral'},
      {key:'mutual', label:'相互関係（両想い・両者敵対など）', type:'checkbox'},
      {key:'description', label:'説明', type:'textarea', placeholder:'関係の背景や経緯', rows:3}
    ],
    onReady: (fieldRefs, modal)=>{
      const fromSel = fieldRefs.fromId, toSel = fieldRefs.toId;
      const warn = el('div', {class:'hint hint-warn hidden'}, ['⚠ 同じキャラクターが選択されています']);
      toSel.parentElement.appendChild(warn);
      const refresh = ()=> warn.classList.toggle('hidden', !fromSel.value || fromSel.value !== toSel.value);
      fromSel.addEventListener('change', refresh);
      toSel.addEventListener('change', refresh);
      refresh();
    },
    onDelete: existing ? async ()=>{ await Store.softDeleteDoc(State.currentProjectId, 'relationships', existing.id); toast('関係性をゴミ箱に移動しました'); } : null,
    onSubmit: async (vals)=>{
      if (!vals.fromId || !vals.toId){ toast('キャラクターA・Bを両方選択してください'); return; }
      vals.updatedBy = nick(); vals.updatedAt = Date.now();
      if (existing) await Store.updateDoc(State.currentProjectId, 'relationships', existing.id, vals);
      else {
        vals.createdAt = Date.now();
        vals.order = State.data.relationships.length ? Math.max(...State.data.relationships.map(r=>r.order||0))+10 : 10;
        await Store.addDoc(State.currentProjectId, 'relationships', vals);
      }
      toast('保存しました');
    }
  });
}

let timelineViewMode = 'world';
let timelineCharFilter = null;
function buildTimelineList(events){
  const tl = el('div', {class:'timeline'});
  events.forEach(t=>{
    const item = el('div', {class:'tl-item'+(t.isFlashback?' flash':'')});
    const card = el('div', {class:'tl-card'});
    card.appendChild(el('div', {class:'tl-date'}, [(t.dateLabel||'（時期未設定）') + (t.isFlashback?'　回想シーン':'')]));
    card.appendChild(el('div', {class:'tl-title'}, [t.title || '(無題の出来事)']));
    if (t.description) card.appendChild(el('div', {class:'ir-desc'}, [t.description]));
    if (t.charIds && t.charIds.length){
      const chips = el('div', {class:'tl-chars'});
      t.charIds.forEach(cid=>{ const c = charById(cid); if (c) chips.appendChild(el('span', {class:'char-chip', style:`background:${c.color||'#6C4CF0'}`}, [c.name])); });
      card.appendChild(chips);
    }
    card.appendChild(el('div', {class:'card-actions'}, [ el('button', {class:'btn btn-sm', onclick:()=>openTimelineForm(t)}, ['編集']) ]));
    item.appendChild(card);
    tl.appendChild(item);
  });
  return tl;
}
function isWorldEvent(t){ return !t.charIds || !t.charIds.length; }
function buildTimelineWorld(){
  const outer = el('div', {});

}

    outer.appendChild(el('div', {class:'empty-state'}, ['まずキャラクターを登録してください。']));
    return outer;
  }
  if (!timelineCharFilter || !orderedChars.some(c=>c.id===timelineCharFilter)) timelineCharFilter = orderedChars[0].id;
  const toolbar = el('div', {class:'toolbar'});
  const charSelect = el('select', {style:'width:auto;'});
  orderedChars.forEach(c=>{
    const opt = el('option', {value:c.id}, [charFullName(c)]);
    if (c.id===timelineCharFilter) opt.setAttribute('selected','selected');
    charSelect.appendChild(opt);
  });
  charSelect.addEventListener('change', ()=>{ timelineCharFilter = charSelect.value; renderTimeline(); });
  toolbar.appendChild(charSelect);
  outer.appendChild(toolbar);

  const c = charById(timelineCharFilter);
  const by = charBirthYear(c), dy = charDeathYear(c), ageVal = charAge(c);

  const addBtn = el('button', {class:'btn btn-sm', style:'margin-bottom:14px;', onclick:()=>openTimelineForm(null, timelineCharFilter)}, ['＋ この人物の出来事を追加']);

  outer.appendChild(el('div', {class:'hint', style:'margin:-6px 0 10px;'}, ['カードをつかんでドラッグすると順番を変更できます']));
  const tl = buildTimelineList(events);
  outer.appendChild(tl);
  makeDraggableList(tl, events, 'timeline');

function buildTimelineAll(){

const SCHEDULE_STATUS = [ {value:'todo', label:'未着手'}, {value:'doing', label:'進行中'}, {value:'done', label:'完了'} ];

const SCHEDULE_STATUS_CLASS = {todo:'st-draft', doing:'st-writing', done:'st-done'};
function todayStr(){ return new Date().toISOString().slice(0,10); }
function scheduleUrgency(s){
  if (s.status === 'done' || !s.dueDate) return 'none';
  const today = todayStr();
  if (s.dueDate < today) return 'overdue';
  const soon = new Date(); soon.setDate(soon.getDate()+3);
  if (s.dueDate <= soon.toISOString().slice(0,10)) return 'soon';
  return 'none';
}
function renderSchedule(){

/* ============================= CONTRADICTION CHECKS ============================= */
let lastIssues = [];
function extractYear(str){
  if (!str) return null;
  const m = String(str).match(/-?\d{1,6}/);
  return m ? parseInt(m[0],10) : null;
}
function runChecks(){
  const issues = [];
  const { characters, relationships, timeline, world, plot } = State.data;
  const charIds = new Set(characters.map(c=>c.id));

  // 1. duplicate names
  const nameMap = {};
  characters.forEach(c=>{
    const key = (c.name||'').trim().toLowerCase();
    if (!key) return;
    (nameMap[key] = nameMap[key]||[]).push(c);
  });
  Object.values(nameMap).forEach(list=>{
    if (list.length > 1) issues.push({ severity:'warning', message:`キャラクター名「${list[0].name}」が${list.length}件重複しています`, detail:'同一人物か、名前を変えるべきか確認してください。', tab:'characters', targetType:'characters', targetId:list[0].id });
  });

  // 2. orphan relationship references
  relationships.forEach(r=>{
    if (!charIds.has(r.fromId) || !charIds.has(r.toId)){
      issues.push({ severity:'error', message:'削除済みのキャラクターを参照している関係性があります', detail:`関係「${r.type||''}」が存在しないキャラクターを指しています。編集または削除してください。`, tab:'relationships', targetType:'relationships', targetId:r.id });
    } else if (r.fromId === r.toId){
      const c = charById(r.fromId);
      issues.push({ severity:'warning', message:`「${c?c.name:'?'}」の関係性が自分自身に向いています`, detail:'キャラクターの差し替えが途中になっていないか確認してください。', tab:'relationships', targetType:'relationships', targetId:r.id });
    }
  });

  // 3. birth/death vs timeline
  characters.forEach(c=>{
    const birthY = charBirthYear(c), deathY = charDeathYear(c);
    if (birthY==null && deathY==null) return;
    if (birthY!=null && deathY!=null && deathY < birthY){
      issues.push({ severity:'error', message:`「${c.name}」の没年（${deathY}）が生年（${birthY}）より前になっています`, detail:'生年と没年の表記を見直してください。', tab:'characters', targetType:'characters', targetId:c.id });
    }
    timeline.forEach(t=>{
      if (t.isFlashback) return;
      if (!t.charIds || !t.charIds.includes(c.id)) return;
      const evY = extractYear(t.dateLabel);
      if (evY==null) return;
      if (deathY!=null && evY > deathY){
        issues.push({ severity:'warning', message:`「${c.name}」の没年（${deathY}）より後の年表に登場しています`, detail:`出来事「${t.title||''}」（${t.dateLabel}）`, tab:'timeline', targetType:'timeline', targetId:t.id });
      }
      if (birthY!=null && evY < birthY){
        issues.push({ severity:'warning', message:`「${c.name}」の生年（${birthY}）より前の年表に登場しています`, detail:`出来事「${t.title||''}」（${t.dateLabel}）`, tab:'timeline', targetType:'timeline', targetId:t.id });
      }
    });
  });

  // 4. conflicting relationships between same pair
  const pairMap = {};
  relationships.forEach(r=>{
    const key = [r.fromId, r.toId].sort().join('|');
    (pairMap[key] = pairMap[key]||[]).push(r);
  });
  Object.values(pairMap).forEach(list=>{
    if (list.length < 2) return;
    const favors = new Set(list.map(r=>r.favor));
    if (favors.has('positive') && favors.has('negative')){
      const a = charById(list[0].fromId), b = charById(list[0].toId);
      issues.push({ severity:'warning', message:`「${a?a.name:'?'}」と「${b?b.name:'?'}」の関係が好意的・敵対的の両方で登録されています`, detail:'時期による変化なら関係の説明欄に補足すると分かりやすくなります。', tab:'relationships', targetType:'relationships', targetId:list[0].id });
    }
  });

  // 5. duplicate plot order
  const orderMap = {};
  plot.forEach(p=>{ const k = String(p.order); (orderMap[k]=orderMap[k]||[]).push(p); });
  Object.values(orderMap).forEach(list=>{
    if (list.length > 1) issues.push({ severity:'warning', message:`プロットの並び順が重複しています（${list.map(p=>p.title||'無題').join(' / ')}）`, detail:'順序を調整すると章の流れが分かりやすくなります。', tab:'plot', targetType:'plot', targetId:list[0].id });
  });

  // 6. duplicate world entry names within category
  const worldMap = {};
  world.forEach(w=>{ const k = (w.category||'')+'|'+(w.name||'').trim().toLowerCase(); if(!w.name) return; (worldMap[k]=worldMap[k]||[]).push(w); });
  Object.values(worldMap).forEach(list=>{
    if (list.length > 1) issues.push({ severity:'warning', message:`世界観設定「${list[0].name}」（${list[0].category}）が重複しています`, detail:'同じ対象を別々に登録していないか確認してください。', tab:'world', targetType:'world', targetId:list[0].id });
  });

  // 7. timeline events out of chronological order (回想シーンは対象外)
  const chronoTimeline = [...timeline].filter(t=>!t.isFlashback).sort((a,b)=>(a.order??0)-(b.order??0));
  let prevYear = null, prevT = null;
  chronoTimeline.forEach(t=>{
    const y = extractYear(t.dateLabel);
    if (y==null) return;
    if (prevYear!=null && y < prevYear){
      issues.push({ severity:'warning', message:`年表の並び順と時期が前後しています（「${prevT.title||'(無題)'}」${prevT.dateLabel} → 「${t.title||'(無題)'}」${t.dateLabel}）`, detail:'並び順をドラッグで調整するか、回想シーンの場合はチェック対象外に設定してください。', tab:'timeline', targetType:'timeline', targetId:t.id });
    }
    prevYear = y; prevT = t;
  });

  lastIssues = issues;
  const badge1 = document.getElementById('issueBadge'), badge2 = document.getElementById('issueBadgeMobile');
  [badge1, badge2].forEach(b=>{
    if (!b) return;
    if (issues.length){ b.textContent = issues.length; b.classList.remove('hidden'); }
    else { b.classList.add('hidden'); }
  });
  if (State.activeTab === 'checks') renderChecks();
}

function initMascot(){
  const mascots = Array.from(document.querySelectorAll('.mini-mascot'));
  if (!mascots.length) return;
  const MAX_OFFSET = 3.8;
  const CROSS_BIAS = 2.2; /* 通常時は少し寄り目。この間隔は追従中も一定に保つ */
  function trackTo(clientX, clientY){
    mascots.forEach(mascot=>{
      const r = mascot.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const dx = clientX - cx, dy = clientY - cy;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const ox = (dx/dist) * Math.min(MAX_OFFSET, dist/8);
      const oy = (dy/dist) * Math.min(MAX_OFFSET, dist/8);
      Array.from(mascot.querySelectorAll('.mascot-pupil')).forEach((p,i)=>{
        const bias = i===0 ? CROSS_BIAS : -CROSS_BIAS;
        p.style.transform = `translate(calc(-50% + ${ox+bias}px), calc(-50% + ${oy}px))`;
      });
    });
  }
  document.addEventListener('mousemove', (e)=> trackTo(e.clientX, e.clientY));
  /* ネイティブのドラッグ操作中はmousemoveが発火しないため、dragoverでも追従させる */
  document.addEventListener('dragover', (e)=> trackTo(e.clientX, e.clientY));
}
initMascot();

function initMascotPetting(){
  const mascot = document.getElementById('miniMascotDark');
  if (!mascot) return;
  let lastX = null, lastDir = 0, reversals = 0, lastReversalTime = 0, cooldownUntil = 0;
  mascot.addEventListener('mousemove', (e)=>{
    const now = Date.now();
    if (lastX !== null && now >= cooldownUntil){
      const dx = e.clientX - lastX;
      if (Math.abs(dx) > 1.5){
        const dir = dx > 0 ? 1 : -1;
        if (lastDir && dir !== lastDir){
          reversals = (now - lastReversalTime < 900) ? reversals + 1 : 1;
          lastReversalTime = now;
          if (reversals >= 4){
            reversals = 0;
            cooldownUntil = now + 1500;
            mascot.classList.remove('mascot-wiggle');
            void mascot.offsetWidth;
            mascot.classList.add('mascot-wiggle');
            setTimeout(()=> mascot.classList.remove('mascot-wiggle'), 750);
          }
        }
        lastDir = dir;
      }
    }
    lastX = e.clientX;
  });
  mascot.addEventListener('mouseleave', ()=>{ lastX = null; lastDir = 0; reversals = 0; });
  mascot.addEventListener('click', mascotReact);
}

const FEED_WINDOW_MS = 12000;
const FEED_OVERFEED_COUNT = 5;
const FEED_BIG_DURATION_MS = 10000;
function initMascotFeeding(){
  const mascot = document.getElementById('miniMascotDark');
  if (!mascot) return;
  let feedTimestamps = [];
  let mascotBigTimer = null;
  mascot.addEventListener('dragover', (e)=>{ e.preventDefault(); mascot.classList.add('mascot-hungry'); });
  mascot.addEventListener('dragleave', ()=>{ mascot.classList.remove('mascot-hungry'); });
  mascot.addEventListener('drop', (e)=>{
    e.preventDefault();
    mascot.classList.remove('mascot-hungry');
    const text = (e.dataTransfer.getData('text/plain') || '').trim();
    if (!text) return;
    const short = text.length > 10 ? text.slice(0,10)+'…' : text;

    const now = Date.now();
    feedTimestamps.push(now);
    feedTimestamps = feedTimestamps.filter(t => now - t < FEED_WINDOW_MS);
    if (feedTimestamps.length >= FEED_OVERFEED_COUNT){
      if (!mascot.classList.contains('mascot-big')){
        mascot.classList.add('mascot-big');
        toast('タピ岡、食べすぎてぱんぱんに…！');
      }
      clearTimeout(mascotBigTimer);
      mascotBigTimer = setTimeout(()=>{
        mascot.classList.remove('mascot-big');
        feedTimestamps = [];
      }, FEED_BIG_DURATION_MS);
    }
    const r = mascot.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const tx = cx - e.clientX, ty = cy - e.clientY;
    const morsel = el('div', {class:'mascot-morsel', style:`left:${e.clientX}px; top:${e.clientY}px; --tx:${tx}px; --ty:${ty}px;`}, [short.length>6 ? short.slice(0,6)+'…' : short]);
    document.body.appendChild(morsel);
    setTimeout(()=> morsel.remove(), 550);

    const isCharacterName = (State.data.characters || []).some(c => (c.name && c.name === text) || charFullName(c) === text);
    const isDisliked = !isCharacterName && MASCOT_NEGATIVE_WORDS.includes(text);
    const isLiked = isCharacterName || MASCOT_POSITIVE_WORDS.includes(text);
    const chewCount = 2 + Math.floor(Math.random()*2); /* 2〜3回、ゆっくり */
    const chewDuration = chewCount * 500;
    const pattern = ['neutral', 'closed', 'neutral-then-closed'][Math.floor(Math.random()*3)];

    setTimeout(()=>{
      mascot.style.setProperty('--chew-count', chewCount);
      mascot.classList.add('mascot-chewing');
      if (!isDisliked && pattern === 'closed') mascot.classList.add('mascot-happy-closed');

      setTimeout(()=>{
        mascot.classList.remove('mascot-chewing');
        if (isDisliked){
          mascot.classList.add('mascot-displeased');
          setTimeout(()=> mascot.classList.remove('mascot-displeased'), 900);
          for (let i=0; i<2; i++){
            setTimeout(()=>{
              const cloud = el('div', {class:'mascot-moyamoya', style:`left:${cx + (Math.random()*18-9)}px; top:${r.top}px;`});
              document.body.appendChild(cloud);
              setTimeout(()=> cloud.remove(), 1100);
            }, i*180);
          }
          toast(`タピ岡は「${short}」があまり好きじゃないみたい…`);
          return;
        }
        if (isLiked){
          mascot.classList.add('mascot-jump', 'mascot-happy-closed');
          setTimeout(()=> mascot.classList.remove('mascot-jump'), 900);
          setTimeout(()=> mascot.classList.remove('mascot-happy-closed'), 900);
        } else if (pattern === 'closed'){
          setTimeout(()=> mascot.classList.remove('mascot-happy-closed'), 350);
        } else if (pattern === 'neutral-then-closed'){
          mascot.classList.add('mascot-happy-closed');
          setTimeout(()=> mascot.classList.remove('mascot-happy-closed'), 500);
        }
        const heartCount = isLiked ? 3 : 2;
        for (let i=0; i<heartCount; i++){
          setTimeout(()=>{
            const heart = el('div', {class:'mascot-heart', style:`left:${cx + (Math.random()*18-9)}px; top:${r.top}px;`}, ['♥']);
            document.body.appendChild(heart);
            setTimeout(()=> heart.remove(), 1000);
          }, i*150);

        if (MASCOT_RAINBOW_WORDS.includes(text)){

          }, 4000);
        } else {
          const colorMatch = MASCOT_COLOR_MAP[text];
          if (colorMatch){

  let zzzInterval = null;

  function spawnZzz(){
    mascots.forEach(mascot=>{
      const r = mascot.getBoundingClientRect();
      const z = el('div', {class:'mascot-zzz', style:`left:${r.left + r.width*0.7}px; top:${r.top}px;`}, ['Zzz']);
      document.body.appendChild(z);
      setTimeout(()=> z.remove(), 1800);
    });
  }
  function wake(){
    lastActivity = Date.now();
    if (asleep){
      asleep = false;
      mascots.forEach(m=> m.classList.remove('mascot-sleep'));
      if (zzzInterval){ clearInterval(zzzInterval); zzzInterval = null; }
    }
  }
  ['mousemove','dragover','mousedown'].forEach(evt=> document.addEventListener(evt, wake));

  setInterval(()=>{
    if (!asleep && Date.now() - lastActivity > IDLE_MS){
      asleep = true;
      mascots.forEach(m=> m.classList.add('mascot-sleep'));
      spawnZzz();
      zzzInterval = setInterval(spawnZzz, 1800);
    }
  }, 1000);
}
initMascotSleep();
</script>
